name: Image Finder regression tests

on:
  push:
    paths:
      - 'image-finder.js'
      - 'index.html'
      - 'tests/image-finder.test.cjs'
      - '.github/workflows/image-finder-tests.yml'
  pull_request:
    paths:
      - 'image-finder.js'
      - 'index.html'
      - 'tests/image-finder.test.cjs'
      - '.github/workflows/image-finder-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check image-finder.js
      - name: Run regression tests
        run: node --test tests/image-finder.test.cjs

name: Update Pop image index
on:
  push:
    branches: [main]
    paths:
      - 'assets/pop_images/**'
      - '!assets/pop_images/index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate image filename index
        shell: python
        run: |
          import json
          from pathlib import Path
          folder = Path("assets/pop_images")
          images = sorted(p.name for p in folder.iterdir() if p.is_file() and p.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp", ".gif"})
          (folder / "index.json").write_text(json.dumps(images, indent=2) + "\n", encoding="utf-8")
      - name: Commit index if changed
        run: |
          git add assets/pop_images/index.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update Pop image index"
            git push
          fi
